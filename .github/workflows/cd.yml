name: Continuous Deployment & Cluster Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-kind-deployment
  cancel-in-progress: false

jobs:
  deploy-and-verify-kind:
    name: Local Kind Cluster Deployment & Smoke Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Validate Terraform IaC
        run: |
          echo "### Terraform IaC Validation" >> $GITHUB_STEP_SUMMARY
          cd terraform
          terraform init -backend=false
          terraform validate
          echo "Terraform configuration is syntactically valid and modularly sound." >> $GITHUB_STEP_SUMMARY

      - name: Create Kind Kubernetes Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind
          version: v0.24.0
          wait: 120s

      - name: Install Metrics Server for HPA
        run: |
          echo "Installing Metrics Server on Kind cluster..."
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type 'json' -p '[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
          kubectl rollout status deployment metrics-server -n kube-system --timeout=120s

      - name: Build Docker Container Images
        id: build
        run: |
          set -euo pipefail
          IMAGE_TAG="$GITHUB_SHA"
          echo "Building wealthgenie-server image..."
          docker build --build-arg APP_BUILD_SHA="$GITHUB_SHA" -f server/Dockerfile \
            -t "wealthgenie-server:$IMAGE_TAG" -t wealthgenie-server:latest .

          echo "Building wealthgenie-ml-service image..."
          docker build -f ml-service/Dockerfile -t "wealthgenie-ml-service:$IMAGE_TAG" \
            -t wealthgenie-ml-service:latest ml-service/

          echo "Building wealthgenie-frontend image..."
          docker build --build-arg VITE_API_URL=/api \
            --build-arg VITE_BUILD_SHA="$GITHUB_SHA" \
            -f reactapp/Dockerfile \
            -t "wealthgenie-frontend:$IMAGE_TAG" \
            -t wealthgenie-frontend:latest \
            .

          SERVER_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "wealthgenie-server:$IMAGE_TAG")
          FRONTEND_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "wealthgenie-frontend:$IMAGE_TAG")
          ML_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "wealthgenie-ml-service:$IMAGE_TAG")
          FRONTEND_CONTAINER=$(docker create "wealthgenie-frontend:$IMAGE_TAG")
          mkdir -p build/frontend-artifacts
          docker cp "$FRONTEND_CONTAINER:/usr/share/nginx/html/." build/frontend-artifacts/
          docker rm "$FRONTEND_CONTAINER"
          BUILD_GIT_COMMIT_SHA="$GITHUB_SHA" \
          BUILD_GIT_TREE_SHA="$(git rev-parse 'HEAD^{tree}')" \
          BUILD_SERVER_IMAGE_ID="$SERVER_IMAGE_ID" \
          BUILD_FRONTEND_IMAGE_ID="$FRONTEND_IMAGE_ID" \
          BUILD_ML_IMAGE_ID="$ML_IMAGE_ID" \
          BUILD_WORKFLOW_RUN_ID="$GITHUB_RUN_ID" \
          BUILD_WORKFLOW_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" \
          BUILD_FRONTEND_ARTIFACT_DIRECTORY="$GITHUB_WORKSPACE/build/frontend-artifacts" \
          BUILD_PROVENANCE_OUTPUT="$GITHUB_WORKSPACE/build/provenance.json" \
            node server/scripts/createBuildProvenance.js
          node -e 'const p = require("./build/provenance.json"); for (const [name, value] of Object.entries({provenance_sha256:p.provenanceSha256, frontend_artifact_set_sha256:p.frontendArtifactSetSha256, git_tree_sha:p.gitTreeSha, server_image_id:p.serverImageIdentity, frontend_image_id:p.frontendImageIdentity, ml_image_id:p.mlImageIdentity})) console.log(`${name}=${value}`)' >> "$GITHUB_OUTPUT"
          {
            echo '### Immutable build identities'
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Tree: `$(git rev-parse 'HEAD^{tree}')`"
            echo "- Provenance SHA-256: `$(node -p 'require("./build/provenance.json").provenanceSha256')`"
            echo "- Frontend artifact set SHA-256: `$(node -p 'require("./build/provenance.json").frontendArtifactSetSha256')`"
            echo "- Docker image IDs: server `$SERVER_IMAGE_ID`, frontend `$FRONTEND_IMAGE_ID`, ML `$ML_IMAGE_ID`"
            echo '- Docker image IDs are local image identities; no registry digest is asserted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load Images into Kind Cluster
        run: |
          set -euo pipefail
          IMAGE_TAG="$GITHUB_SHA"
          echo "Loading container images into Kind cluster nodes..."
          kind load docker-image "wealthgenie-server:$IMAGE_TAG" --name kind
          kind load docker-image "wealthgenie-ml-service:$IMAGE_TAG" --name kind
          kind load docker-image "wealthgenie-frontend:$IMAGE_TAG" --name kind

      - name: Apply database prerequisites
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create configmap wealthgenie-build-provenance -n wealthgenie \
            --from-file=provenance.json=build/provenance.json \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply \
            -f k8s/configmap.yaml \
            -f k8s/mongodb/pvc.yaml \
            -f k8s/mongodb/statefulset.yaml \
            -f k8s/mongodb/service.yaml \
            -f k8s/redis/deployment.yaml \
            -f k8s/redis/service.yaml

      - name: Inject ephemeral secrets for Kind validation cluster
        run: |
          EPHEMERAL_JWT=$(openssl rand -hex 32)
          EPHEMERAL_ML_KEY=$(openssl rand -hex 16)
          EPHEMERAL_ML_OPERATOR_KEY=$(openssl rand -hex 16)
          EPHEMERAL_METRICS_TOKEN=$(openssl rand -hex 32)
          kubectl create secret generic wealthgenie-secrets -n wealthgenie \
            --from-literal=JWT_SECRET="$EPHEMERAL_JWT" \
            --from-literal=GEMINI_API_KEY="ci-mock-gemini-key" \
            --from-literal=ML_SERVICE_API_KEY="$EPHEMERAL_ML_KEY" \
            --from-literal=ML_OPERATOR_KEY="$EPHEMERAL_ML_OPERATOR_KEY" \
            --from-literal=METRICS_TOKEN="$EPHEMERAL_METRICS_TOKEN" \
            --from-literal=MONGODB_URI="mongodb://wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017/wealthgenie?replicaSet=rs0" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for Database and Redis to be Ready
        run: |
          echo "Waiting for MongoDB StatefulSet to be Ready..."
          kubectl rollout status statefulset/wealthgenie-mongodb -n wealthgenie --timeout=240s

          echo "Waiting for Redis Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-redis -n wealthgenie --timeout=240s

      - name: Run the one-shot Phase 2 index migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase2-index-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 3 ML/RAG state migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase3-state-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 4 PlanReview persistence migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase4-plan-review-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 5 durable agent runtime migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase5-agent-runtime-migration/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Run the one-shot Phase 7 ResearchAgent task migration
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase7-research-task-migration.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for ResearchAgent task migration Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=300s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Bootstrap and verify the shared RAG corpus generation
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase3-rag-bootstrap/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for RAG corpus bootstrap Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=900s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Bootstrap trusted Phase 3 serving bundles
        run: |
          set -euo pipefail
          JOB_NAME=$(sed -E "s/(wealthgenie-(server|ml-service)):latest/\1:${GITHUB_SHA}/g" k8s/phase3-serving-bootstrap/job.yaml | kubectl create -f - -o jsonpath='{.metadata.name}')
          echo "Waiting for serving-bundle bootstrap Job ${JOB_NAME} to complete..."
          if kubectl wait --for=condition=complete "job/${JOB_NAME}" -n wealthgenie --timeout=360s; then
            kubectl logs "job/${JOB_NAME}" -n wealthgenie
          else
            kubectl describe "job/${JOB_NAME}" -n wealthgenie || true
            kubectl logs "job/${JOB_NAME}" -n wealthgenie --all-containers=true || true
            exit 1
          fi

      - name: Apply application manifests after database migrations
        run: |
          set -euo pipefail
          mkdir -p build
          kubectl kustomize k8s/ \
            | sed -E "s/(wealthgenie-(server|frontend|ml-service)):latest/\1:${GITHUB_SHA}/g" \
            > build/k8s-pinned.yaml
          kubectl apply -f build/k8s-pinned.yaml

      - name: Wait for Microservices to be Ready
        run: |
          echo "Waiting for ML Service Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-ml-service -n wealthgenie --timeout=360s || {
            echo "--- ML Service Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-ml-service
            echo "--- ML Service Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-ml-service --tail=80
            exit 1
          }
          ML_POD=$(kubectl get pods -n wealthgenie -l app=wealthgenie-ml-service -o jsonpath='{.items[0].metadata.name}')
          kubectl exec "$ML_POD" -n wealthgenie -- python -c "import os,urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/rag/readyz',headers={'X-API-Key':os.environ['ML_SERVICE_API_KEY']}); print(urllib.request.urlopen(req,timeout=10).read().decode())"

          echo "Waiting for Express Server Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-server -n wealthgenie --timeout=300s || {
            echo "--- Server Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-server
            echo "--- Server Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-server --tail=80
            exit 1
          }

          echo "Waiting for Frontend Deployment to be Ready..."
          kubectl rollout status deployment/wealthgenie-frontend -n wealthgenie --timeout=180s || {
            echo "--- Frontend Pod Describe ---"
            kubectl describe pods -n wealthgenie -l app=wealthgenie-frontend
            echo "--- Frontend Pod Logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-frontend --tail=80
            exit 1
          }

      - name: Verify Cluster State
        env:
          EXPECTED_SERVER_IMAGE_ID: ${{ steps.build.outputs.server_image_id }}
          EXPECTED_FRONTEND_IMAGE_ID: ${{ steps.build.outputs.frontend_image_id }}
          EXPECTED_ML_IMAGE_ID: ${{ steps.build.outputs.ml_image_id }}
        run: |
          set -euo pipefail
          for deployment in wealthgenie-server wealthgenie-agent-worker wealthgenie-frontend wealthgenie-ml-service; do
            actual_image=$(kubectl get deployment "$deployment" -n wealthgenie -o jsonpath='{.spec.template.spec.containers[0].image}')
            expected_image="${deployment/wealthgenie-agent-worker/wealthgenie-server}:$GITHUB_SHA"
            if [[ "$actual_image" != "$expected_image" ]]; then
              echo "ERROR: $deployment is not pinned to this workflow's immutable commit tag: $actual_image"
              exit 1
            fi
          done

          verify_deployed_image_identity() {
            local workload="$1"
            local image_ref="$2"
            local expected_image_id="$3"
            local kind_node
            local image_info
            local runtime_image_id
            local allowed_image_ids
            kind_node=$(kind get nodes --name kind | head -n 1)
            if [[ -z "$kind_node" ]]; then
              echo "ERROR: Kind node is unavailable while verifying $workload image identity"
              exit 1
            fi
            image_info=$(docker exec "$kind_node" crictl inspecti "$image_ref")
            runtime_image_id=$(jq -r '.status.id // empty' <<< "$image_info")
            if [[ "$runtime_image_id" != "$expected_image_id" ]]; then
              echo "ERROR: Kind runtime image identity for $image_ref differs from the Docker image ID recorded at build time"
              echo "Expected: $expected_image_id"
              echo "Runtime:  $runtime_image_id"
              exit 1
            fi
            allowed_image_ids=$(jq -c '[.status.id, (.status.repoDigests[]?)] | map(select(type == "string") | split("@")[-1]) | unique' <<< "$image_info")
            if ! kubectl get pods -n wealthgenie -l "app=$workload" -o json \
              | jq -e --argjson allowed "$allowed_image_ids" '
                [.items[] | .status.containerStatuses[]?.imageID
                  | sub("^.*://"; "") | split("@")[-1]] as $imageIds
                | ($imageIds | length) > 0
                  and all($imageIds[]; . as $imageId | ($allowed | index($imageId)) != null)
              ' > /dev/null; then
              echo "ERROR: running $workload pods do not report an image identity for the exact Kind image built by this workflow: $expected_image_id"
              kubectl get pods -n wealthgenie -l "app=$workload" -o json \
                | jq -r '[.items[] | {name:.metadata.name, imageIds:[.status.containerStatuses[]?.imageID]}]'
              exit 1
            fi
            echo "Verified runtime image identity for $workload: $expected_image_id"
          }

          verify_deployed_image_identity wealthgenie-server "wealthgenie-server:$GITHUB_SHA" "$EXPECTED_SERVER_IMAGE_ID"
          verify_deployed_image_identity wealthgenie-agent-worker "wealthgenie-server:$GITHUB_SHA" "$EXPECTED_SERVER_IMAGE_ID"
          verify_deployed_image_identity wealthgenie-frontend "wealthgenie-frontend:$GITHUB_SHA" "$EXPECTED_FRONTEND_IMAGE_ID"
          verify_deployed_image_identity wealthgenie-ml-service "wealthgenie-ml-service:$GITHUB_SHA" "$EXPECTED_ML_IMAGE_ID"
          echo "### Kubernetes Pod & Service Status" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl get all,pvc,hpa,ingress -n wealthgenie >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n wealthgenie -o wide

      - name: Execute Live Smoke Tests & Prove Request Flow (Step 2)
        env:
          EXPECTED_PROVENANCE_SHA256: ${{ steps.build.outputs.provenance_sha256 }}
          EXPECTED_FRONTEND_ARTIFACT_SHA256: ${{ steps.build.outputs.frontend_artifact_set_sha256 }}
          EXPECTED_GIT_TREE_SHA: ${{ steps.build.outputs.git_tree_sha }}
          EXPECTED_SERVER_IMAGE_ID: ${{ steps.build.outputs.server_image_id }}
          EXPECTED_FRONTEND_IMAGE_ID: ${{ steps.build.outputs.frontend_image_id }}
          EXPECTED_ML_IMAGE_ID: ${{ steps.build.outputs.ml_image_id }}
        run: |
          set -euo pipefail
          echo "### Live Endpoint Smoke Test Verification (Step 2)" >> $GITHUB_STEP_SUMMARY

          echo "Starting scoped port-forward from Service to runner localhost:5000..."
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-server 5000:5000 > port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-frontend 8080:80 > frontend-port-forward.log 2>&1 &
          FRONTEND_PORT_FORWARD_PID=$!
          trap 'kill "$PORT_FORWARD_PID" "$FRONTEND_PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          print_server_diagnostics() {
            echo "--- port-forward log ---"
            cat port-forward.log || true
            echo "--- server pods ---"
            kubectl get pods -n wealthgenie -l app=wealthgenie-server -o wide || true
            echo "--- server endpoints ---"
            kubectl get endpoints -n wealthgenie wealthgenie-server -o yaml || true
            echo "--- recent server logs ---"
            kubectl logs -n wealthgenie -l app=wealthgenie-server --tail=100 || true
          }

          wait_for_http_2xx() {
            local url="$1"
            local attempts="$2"
            local delay_seconds="$3"
            local response_file
            local status
            response_file=$(mktemp)
            for attempt in $(seq 1 "$attempts"); do
              status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output "$response_file" --write-out '%{http_code}' "$url" || true)
              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep "$delay_seconds"
              fi
            done
            echo "ERROR: $url did not return a successful response after $attempts attempts (last status: $status)"
            cat "$response_file" || true
            rm -f "$response_file"
            return 1
          }

          if ! wait_for_http_2xx http://127.0.0.1:5000/health/live 30 2 > /dev/null; then
            print_server_diagnostics
            exit 1
          fi

          echo "1. Testing /health/live..."
          LIVE_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/live)
          if ! jq -e --arg expected "$GITHUB_SHA" '.buildSha == $expected' <<< "$LIVE_RES" > /dev/null; then
            echo "ERROR: live server build identity does not match the workflow SHA"
            print_server_diagnostics
            exit 1
          fi
          if ! jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg tree "$EXPECTED_GIT_TREE_SHA" \
            --arg provenance "$EXPECTED_PROVENANCE_SHA256" \
            --arg artifacts "$EXPECTED_FRONTEND_ARTIFACT_SHA256" \
            --arg server "$EXPECTED_SERVER_IMAGE_ID" \
            --arg frontend "$EXPECTED_FRONTEND_IMAGE_ID" \
            --arg ml "$EXPECTED_ML_IMAGE_ID" \
            '.buildProvenance.status == "VERIFIED" and .buildProvenance.gitCommitSha == $commit and .buildProvenance.gitTreeSha == $tree and .buildProvenance.provenanceSha256 == $provenance and .buildProvenance.frontendArtifactSetSha256 == $artifacts and .buildProvenance.serverImageIdentity == $server and .buildProvenance.frontendImageIdentity == $frontend and .buildProvenance.mlImageIdentity == $ml' \
            <<< "$LIVE_RES" > /dev/null; then
            echo "ERROR: backend health did not return the expected verified artifact provenance"
            print_server_diagnostics
            exit 1
          fi
          echo "Live Response: $LIVE_RES"
          echo "- **Liveness Probe (/health/live)**: \`$LIVE_RES\`" >> $GITHUB_STEP_SUMMARY

          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 http://127.0.0.1:8080/build-provenance/provenance.json > frontend-provenance.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: frontend provenance endpoint did not become available"
              cat frontend-port-forward.log || true
              exit 1
            fi
            sleep 2
          done
          if ! jq -e \
            --arg commit "$GITHUB_SHA" \
            --arg tree "$EXPECTED_GIT_TREE_SHA" \
            --arg provenance "$EXPECTED_PROVENANCE_SHA256" \
            --arg artifacts "$EXPECTED_FRONTEND_ARTIFACT_SHA256" \
            --arg server "$EXPECTED_SERVER_IMAGE_ID" \
            --arg frontend "$EXPECTED_FRONTEND_IMAGE_ID" \
            --arg ml "$EXPECTED_ML_IMAGE_ID" \
            '.gitCommitSha == $commit and .gitTreeSha == $tree and .provenanceSha256 == $provenance and .frontendArtifactSetSha256 == $artifacts and .serverImageIdentity == $server and .frontendImageIdentity == $frontend and .mlImageIdentity == $ml' \
            frontend-provenance.json > /dev/null; then
            echo "ERROR: served frontend and backend do not share the expected provenance manifest"
            exit 1
          fi
          echo "- **Shared build provenance**: backend and frontend both match \`$EXPECTED_PROVENANCE_SHA256\`" >> $GITHUB_STEP_SUMMARY

          echo "2. Testing /health/ready..."
          if ! wait_for_http_2xx http://127.0.0.1:5000/health/ready 30 2 > /dev/null; then
            print_server_diagnostics
            exit 1
          fi
          READY_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/ready)
          echo "Ready Response: $READY_RES"
          echo "- **Readiness Probe (/health/ready)**: \`$READY_RES\`" >> $GITHUB_STEP_SUMMARY

          echo "3. Testing /health/deep (with bounded dependency readiness retry)..."
          if ! wait_for_http_2xx http://127.0.0.1:5000/health/deep 30 2 > /dev/null; then
            print_server_diagnostics
            exit 1
          fi
          DEEP_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/deep)
          echo "Deep Response: $DEEP_RES"
          echo "- **Deep Health Probe (/health/deep)**: \`$DEEP_RES\`" >> $GITHUB_STEP_SUMMARY

          echo "4. Testing Business Endpoint /api/tax/compare..."
          TAX_URL="http://127.0.0.1:5000/api/tax/compare?income=1200000&incomeSource=salary&fiscalYear=FY2026-27&age=30"
          if ! TAX_RES=$(curl --silent --show-error --fail --connect-timeout 5 --max-time 10 "$TAX_URL"); then
            echo "ERROR: tax compare smoke request failed: $TAX_URL"
            curl --silent --show-error --connect-timeout 5 --max-time 10 "$TAX_URL" || true
            print_server_diagnostics
            exit 1
          fi
          echo "Tax Compare Response: $TAX_RES"
          echo "- **Business Tax Endpoint (/api/tax/compare)**: \`$TAX_RES\`" >> $GITHUB_STEP_SUMMARY

      - name: Verify Horizontal Pod Autoscaler & Load Response (Step 3)
        run: |
          set -euo pipefail
          echo "### Horizontal Pod Autoscaler (HPA) Verification (Step 3)" >> $GITHUB_STEP_SUMMARY

          echo "Starting a port-forward scoped to the HPA/load step..."
          kubectl port-forward --address=127.0.0.1 -n wealthgenie svc/wealthgenie-server 5000:5000 > hpa-port-forward.log 2>&1 &
          HPA_PORT_FORWARD_PID=$!
          trap 'kill "$HPA_PORT_FORWARD_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 5 --max-time 10 http://127.0.0.1:5000/health/live > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: HPA-step server port-forward did not become ready"
              cat hpa-port-forward.log || true
              kubectl get pods -n wealthgenie -o wide || true
              kubectl get endpoints -n wealthgenie wealthgenie-server -o yaml || true
              exit 1
            fi
            sleep 2
          done

          if ! kubectl get hpa wealthgenie-server-hpa -n wealthgenie > /dev/null; then
            echo "ERROR: expected HPA wealthgenie-server-hpa does not exist"
            kubectl get hpa -n wealthgenie || true
            exit 1
          fi

          echo "Waiting until metrics-server reports server pod metrics..."
          SERVER_METRICS=""
          for attempt in $(seq 1 30); do
            SERVER_METRICS=$(kubectl top pods -n wealthgenie -l app=wealthgenie-server --no-headers 2>/tmp/wealthgenie-metrics-error || true)
            if echo "$SERVER_METRICS" | awk 'NF >= 3 { found = 1 } END { exit(found ? 0 : 1) }'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: server pod metrics were not available after bounded retries"
              cat /tmp/wealthgenie-metrics-error || true
              kubectl get pods -n wealthgenie -o wide || true
              kubectl describe deployment metrics-server -n kube-system || true
              exit 1
            fi
            sleep 2
          done
          echo "Initial server metrics: $SERVER_METRICS"

          LOAD_URL="http://127.0.0.1:5000/api/tax/compare?income=1200000&incomeSource=salary&fiscalYear=FY2026-27&age=30"
          if ! curl --fail --silent --connect-timeout 5 --max-time 10 "$LOAD_URL" > /dev/null; then
            echo "ERROR: valid HPA load probe failed: $LOAD_URL"
            cat hpa-port-forward.log || true
            exit 1
          fi

          echo "Generating 15s synthetic compute load against cluster..."
          npx autocannon -c 40 -d 15 "$LOAD_URL"

          HPA_TARGET=$(kubectl get hpa wealthgenie-server-hpa -n wealthgenie -o jsonpath='{.spec.metrics[0].resource.target.averageUtilization}')
          HPA_CURRENT=""
          for attempt in $(seq 1 30); do
            HPA_CURRENT=$(kubectl get hpa wealthgenie-server-hpa -n wealthgenie -o jsonpath='{.status.currentMetrics[0].resource.current.averageUtilization}' 2>/dev/null || true)
            if [[ "$HPA_CURRENT" =~ ^[0-9]+$ ]] && [[ "$HPA_TARGET" =~ ^[0-9]+$ ]]; then
              break
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 2
            fi
          done
          if ! [[ "$HPA_CURRENT" =~ ^[0-9]+$ ]] || ! [[ "$HPA_TARGET" =~ ^[0-9]+$ ]]; then
            echo "ERROR: HPA did not publish numeric current/target CPU utilization after load"
            kubectl describe hpa wealthgenie-server-hpa -n wealthgenie || true
            kubectl top pods -n wealthgenie -l app=wealthgenie-server || true
            exit 1
          fi

          HPA_STATUS=$(kubectl get hpa wealthgenie-server-hpa -n wealthgenie)
          echo "HPA Status after load:"
          echo "$HPA_STATUS"
          echo "HPA current CPU utilization: ${HPA_CURRENT}% / target: ${HPA_TARGET}%"
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "$HPA_STATUS" >> $GITHUB_STEP_SUMMARY
          echo "Current CPU utilization: ${HPA_CURRENT}% / target: ${HPA_TARGET}%" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Capture Cluster Logs on Failure
        if: failure()
        run: |
          echo "Cluster pods status on failure:"
          kubectl get pods -n wealthgenie -o wide
          echo "--- Pod Events ---"
          kubectl get events -n wealthgenie --sort-by='.lastTimestamp' | tail -30
          echo "--- MongoDB Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-mongodb --tail=50
          echo "--- Redis Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-redis --tail=50
          echo "--- ML Service Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-ml-service --tail=80
          echo "--- Server Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-server --tail=50
          echo "--- Frontend Logs ---"
          kubectl logs -n wealthgenie -l app=wealthgenie-frontend --tail=50
