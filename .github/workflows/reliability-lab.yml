name: Agent Reliability Lab

on:
  pull_request:
    paths:
      - 'server/agents/reliability/**'
      - 'server/test/reliabilityLab.test.js'
      - 'server/package.json'
      - 'docs/architecture/AGENT_RELIABILITY_LAB.md'
      - '.github/workflows/reliability-lab.yml'
  push:
    branches: [main]
    paths:
      - 'server/agents/reliability/**'
      - 'server/test/reliabilityLab.test.js'
      - 'server/package.json'
      - 'docs/architecture/AGENT_RELIABILITY_LAB.md'
      - '.github/workflows/reliability-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Reliability lab smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run test:reliability --prefix server

  extended:
    name: Reliability lab extended deterministic replay
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run test:reliability --prefix server
      - run: npm run lint --prefix server -- agents/reliability test/reliabilityLab.test.js
