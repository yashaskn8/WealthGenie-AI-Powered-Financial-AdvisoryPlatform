name: A2A v1 MUST conformance

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2a-tck:
    name: ResearchAgent A2A HTTP+JSON MUST checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install WealthGenie server dependencies
        run: npm ci --prefix server

      - name: Start the standalone FinancialResearchAgent
        env:
          NODE_ENV: test
          AGENT_A2A_V1_ENABLED: 'true'
          PORT: '5089'
          AGENT_A2A_PUBLIC_URL: http://127.0.0.1:5088
          AGENT_A2A_DEV_TOKEN: ci-a2a-plan-review-token
          AGENT_IDENTITY_PROVIDER: development
          RESEARCH_SEARCH_PROVIDER: fixture
        run: |
          node server/agents/research/researchAgentServer.js > research-agent.log 2>&1 &
          echo $! > research-agent.pid

      - name: Wait for ResearchAgent liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5089/health/live > /dev/null; then exit 0; fi
            if [ "$attempt" -eq 30 ]; then cat research-agent.log; exit 1; fi
            sleep 1
          done

      - name: Verify ResearchAgent rejects unauthenticated A2A calls
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:5089/a2a/message:send \
            --header 'Content-Type: application/json' --data '{}')
          test "$status" = "401"

      # The pinned TCK documentation describes auth injection, but its pinned
      # HTTP+JSON transport does not attach A2A_AUTH_* headers. Keep the app's
      # bearer check enabled and inject the CI-only caller token at a loopback
      # adapter instead of weakening the application boundary.
      - name: Start loopback authentication adapter for the pinned TCK
        env:
          A2A_TCK_PROXY_TOKEN: ci-a2a-plan-review-token
          A2A_TCK_PROXY_LISTEN_PORT: '5088'
          A2A_TCK_PROXY_UPSTREAM_PORT: '5089'
        run: |
          node server/scripts/a2aTckAuthProxy.js > a2a-tck-proxy.log 2>&1 &
          echo $! > a2a-tck-proxy.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5088/__ci-health > /dev/null; then exit 0; fi
            if [ "$attempt" -eq 30 ]; then cat a2a-tck-proxy.log; exit 1; fi
            sleep 1
          done

      - name: Checkout the official A2A TCK
        env:
          A2A_TCK_SHA: 263b9cfaf16a554bdfb166a7ba5b67716e946349
        run: |
          git init .a2a-tck
          git -C .a2a-tck remote add origin https://github.com/a2aproject/a2a-tck.git
          git -C .a2a-tck fetch --depth 1 origin "$A2A_TCK_SHA"
          git -C .a2a-tck checkout --detach FETCH_HEAD
          test "$(git -C .a2a-tck rev-parse HEAD)" = "$A2A_TCK_SHA"

      - name: Install TCK dependencies
        working-directory: .a2a-tck
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Verify pinned TCK checkout is pristine before test execution
        run: |
          test -z "$(git -C .a2a-tck status --porcelain=v1 --untracked-files=all)"
          test "$(git -C .a2a-tck rev-parse HEAD)" = "263b9cfaf16a554bdfb166a7ba5b67716e946349"

      - name: Test A2A TCK applicability policy validator
        run: python scripts/test_validate_a2a_tck_policy.py

      - name: Run targeted ResearchAgent and A2A tests
        env:
          NODE_ENV: test
          AGENT_A2A_V1_ENABLED: 'true'
          AGENT_A2A_DEV_TOKEN: ci-a2a-plan-review-token
          AGENT_IDENTITY_PROVIDER: development
          RESEARCH_SEARCH_PROVIDER: fixture
        run: node --test --test-concurrency=1 server/test/researchMesh.test.js server/test/researchTaskStore.test.js server/test/a2aTckAuthProxy.test.js

      - name: Run official HTTP+JSON MUST checks
        working-directory: .a2a-tck
        env:
          A2A_TCK_SHA: 263b9cfaf16a554bdfb166a7ba5b67716e946349
        run: |
          tck_started_at=$(date +%s.%N)
          set +e
          python run_tck.py --sut-host http://127.0.0.1:5088 --transport http_json --level must
          raw_tck_exit_code=$?
          set -e
          echo "RAW_TCK_EXIT_CODE=$raw_tck_exit_code"
          python ../scripts/validate_a2a_tck_policy.py \
            --junit reports/junitreport.xml \
            --policy ../.github/a2a-tck-known-blockers.json \
            --tck-dir . \
            --tck-sha "$A2A_TCK_SHA" \
            --raw-exit-code "$raw_tck_exit_code" \
            --started-at "$tck_started_at" \
            --summary-path "$GITHUB_STEP_SUMMARY"

      - name: Upload TCK report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a2a-tck-report
          if-no-files-found: ignore
          path: |
            .a2a-tck/reports/
            research-agent.log
            a2a-tck-proxy.log

      - name: Stop ResearchAgent
        if: always()
        run: |
          if [ -f a2a-tck-proxy.pid ]; then proxy_pid=$(cat a2a-tck-proxy.pid); if kill -0 "$proxy_pid" 2>/dev/null; then kill "$proxy_pid"; fi; fi
          if [ -f research-agent.pid ]; then agent_pid=$(cat research-agent.pid); if kill -0 "$agent_pid" 2>/dev/null; then kill "$agent_pid"; fi; fi
