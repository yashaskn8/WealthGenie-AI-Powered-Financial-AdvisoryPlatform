name: CI Test Matrix

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration-linux:
    name: Backend Linux (Node ${{ matrix.node-version }}, Mongo ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        mongodb-version: ['6.0', '7.0']

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-replica-set: rs0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend ESLint Check
        run: |
          cd server
          npm run lint

      - name: Run Backend Syntax Check
        run: |
          cd server
          npm run typecheck

      - name: Run Backend Tests & Coverage
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017/wealthgenie_test'
        run: |
          JWT_SECRET="${{ secrets.CI_JWT_SECRET }}"
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET=$(openssl rand -hex 32)
          fi
          export JWT_SECRET
          cd server
          npm run test:coverage

      - name: Upload Backend Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-linux-node${{ matrix.node-version }}-mongo${{ matrix.mongodb-version }}
          path: server/reports/

      - name: Audit npm dependencies
        run: |
          cd server
          npm audit --audit-level=high

  backend-unit-windows:
    name: Backend Windows (Node ${{ matrix.node-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend ESLint Check
        run: |
          cd server
          npm run lint

      - name: Run Backend Syntax Check
        run: |
          cd server
          npm run typecheck

      - name: Run Backend Unit Tests (No MongoDB Required)
        run: |
          $JWT_SECRET = "${{ secrets.CI_JWT_SECRET }}"
          if (-not $JWT_SECRET) {
            $JWT_SECRET = -join ((48..57) + (97..122) | Get-Random -Count 64 | ForEach-Object { [char]$_ })
          }
          $env:JWT_SECRET = $JWT_SECRET
          cd server
          # advisoryPersistence.test.js requires real Mongo transaction semantics.
          # It remains fully covered by both Linux/Mongo integration jobs (Mongo 6.0 and 7.0).
          # The Windows job intentionally verifies the cross-platform no-Mongo test surface.
          $unitTestFiles = Get-ChildItem -Path test -Recurse -Filter *.test.js |
            Where-Object { $_.Name -ne 'advisoryPersistence.test.js' } |
            ForEach-Object { $_.FullName }

          if (-not $unitTestFiles -or $unitTestFiles.Count -eq 0) {
            throw "No Windows unit test files selected."
          }

          if ($unitTestFiles | Where-Object { $_ -match '[\\/]advisoryPersistence\.test\.js$' }) {
            throw "Mongo transaction suite was accidentally included in Windows no-Mongo test selection."
          }

          node --test --test-concurrency=1 $unitTestFiles

  frontend-quality-matrix:
    name: Frontend (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: reactapp/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd reactapp
          npm ci

      - name: Run ESLint Check
        run: |
          cd reactapp
          npm run lint

      - name: Run TypeScript Check
        run: |
          cd reactapp
          npm run typecheck

      - name: Run Vitest Suite
        run: |
          cd reactapp
          npm test

      - name: Build Production Frontend
        run: |
          cd reactapp
          npm run build

      - name: Audit npm dependencies
        if: runner.os == 'Linux'
        run: |
          cd reactapp
          npm audit --audit-level=high

  browser-real-dependencies:
    name: Browser lifecycle (Mongo replica set, Redis, FastAPI, Express)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/wealthgenie_e2e?replicaSet=rs0
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: e2e-only-jwt-secret-with-more-than-32-characters
      ML_SERVICE_URL: http://127.0.0.1:8000
      ML_SERVICE_API_KEY: e2e-ml-service-api-key
      ML_OPERATOR_KEY: e2e-ml-operator-key
      ENVIRONMENT: test
      ML_STATE_BACKEND: mongodb
      LLM_DEFAULT_PROVIDER: mock
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      NODE_ENV: development
      DISABLE_RATE_LIMIT: 'true'
      CORS_ORIGINS: http://127.0.0.1:5173
      VITE_API_URL: http://127.0.0.1:5000/api
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173

    steps:
      - uses: actions/checkout@v4

      - name: Start transaction-capable MongoDB
        uses: supercharge/mongodb-github-action@1.10.0
        with:
          mongodb-version: '7.0'
          mongodb-replica-set: rs0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            reactapp/package-lock.json

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install application and browser dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix reactapp
          pip install -r ml-service/requirements.txt
          python ml-service/scripts/verify_serving_artifacts.py
          cd reactapp
          npx playwright install --with-deps chromium

      - name: Start real application services
        run: |
          cd ml-service
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../ml-service-e2e.log 2>&1 &
          cd ../server
          node server.js > ../server-e2e.log 2>&1 &
          cd ../reactapp
          npm run dev -- --host 127.0.0.1 > ../frontend-e2e.log 2>&1 &

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/readyz | grep --quiet '"status":"ready"'; then break; fi
            if [ "$attempt" -eq 90 ]; then cat ml-service-e2e.log; exit 1; fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health/ready > /dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat server-e2e.log; exit 1; fi
            sleep 2
          done
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/login > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat frontend-e2e.log; exit 1; fi
            sleep 2
          done

      - name: Run real-dependency Playwright lifecycle
        run: npm run test:e2e --prefix reactapp

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-real-dependency-failure
          if-no-files-found: ignore
          path: |
            reactapp/test-results/
            ml-service-e2e.log
            server-e2e.log
            frontend-e2e.log

  ml-microservice-quality:
    name: ML Service (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ml-service/requirements.txt

      - name: Install Requirements
        run: |
          cd ml-service
          pip install -r requirements.txt

      - name: Verify qualified serving artifacts
        run: python scripts/verify_serving_artifacts.py
        working-directory: ml-service

      - name: Run Pytest Suite
        run: |
          cd ml-service
          pytest

      - name: Audit pip dependencies
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit==2.10.1
          # accelerate 1.14.0 is transitively required by the retained PEFT
          # training interface. CVE-2026-69112 currently has no fixed release;
          # its vulnerable checkpoint-loading functions are not used by the
          # online inference path. Keep this single exception explicit and
          # continue auditing every other dependency.
          pip-audit -r ml-service/requirements.txt --ignore-vuln CVE-2026-69112
