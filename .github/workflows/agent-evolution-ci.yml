name: Agent Evolution Contract Checks

on:
  push:
    branches: [main]
    paths:
      - 'server/agents/evolution/**'
      - 'server/agents/evals/**'
      - 'server/agents/reliability/**'
      - 'server/agents/planReview/**'
      - 'server/test/governedSelfEvolution.test.js'
      - 'server/test/gepaBridge.test.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/scripts/test-partition.js'
      - 'ml-service/agent_evolution/**'
      - 'ml-service/pyproject.toml'
      - 'ml-service/uv.lock'
      - 'ml-service/requirements.txt'
      - 'ml-service/requirements-agent-evolution-tests.txt'
      - 'ml-service/requirements-ci-audit.txt'
      - 'ml-service/scripts/validate_dependency_lock.js'
      - 'ml-service/Dockerfile'
      - 'ml-service/tests/test_agent_evolution.py'
      - '.github/workflows/agent-evolution-ci.yml'
  pull_request:
    paths:
      - 'server/agents/evolution/**'
      - 'server/agents/evals/**'
      - 'server/agents/reliability/**'
      - 'server/test/governedSelfEvolution.test.js'
      - 'server/test/gepaBridge.test.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/scripts/test-partition.js'
      - 'ml-service/agent_evolution/**'
      - 'ml-service/pyproject.toml'
      - 'ml-service/uv.lock'
      - 'ml-service/requirements.txt'
      - 'ml-service/requirements-agent-evolution-tests.txt'
      - 'ml-service/requirements-ci-audit.txt'
      - 'ml-service/scripts/validate_dependency_lock.js'
      - 'ml-service/Dockerfile'
      - 'ml-service/tests/test_agent_evolution.py'
      - '.github/workflows/agent-evolution-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contracts:
    runs-on: ubuntu-latest
    env:
      AGENT_SELF_EVOLUTION_ENABLED: 'false'
      AGENT_SELF_EVOLUTION_GEPA_ENABLED: 'false'
      AGENT_SELF_EVOLUTION_E2B_ENABLED: 'false'
      AGENT_SELF_EVOLUTION_LIVE_ENABLED: 'false'
      AGENT_SELF_EVOLUTION_AUTO_PROMOTION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Run governed self-evolution contract tests
        working-directory: server
        run: node --test --test-concurrency=1 test/governedSelfEvolution.test.js
      - name: Run backend Node test suite
        run: npm test --prefix server
      - run: npm run lint --prefix server
      - run: npm run typecheck --prefix server
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.10'
          enable-cache: false
      - name: Validate ML dependency lock
        run: node ml-service/scripts/validate_dependency_lock.js
      - name: Install hash-pinned Python evolution test dependencies
        run: python -m pip install --require-hashes -r ml-service/requirements-agent-evolution-tests.txt
      - name: Run Python evolution contract tests
        working-directory: ml-service
        run: python -m pytest tests/test_agent_evolution.py -q
      - run: git diff --check
