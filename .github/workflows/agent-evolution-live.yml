name: Governed Agent Evolution (Manual)

on:
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: 'Lower-than-hard candidate limit for this experiment'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  live-evolution:
    runs-on: ubuntu-latest
    environment: agent-evolution-lab
    env:
      AGENT_SELF_EVOLUTION_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_GEPA_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_LIVE_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_E2B_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_AUTO_PROMOTION_ENABLED: 'false'
      EVOLUTION_MAX_CANDIDATES: ${{ inputs.candidate_limit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: python -m pip install --requirement ml-service/requirements.txt
      - name: Validate manual-only evolution flags
        shell: bash
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_EVOLUTION_MODEL_API_KEY: ${{ secrets.AGENT_EVOLUTION_MODEL_API_KEY }}
          AGENT_EVOLUTION_REFLECTION_MODEL: ${{ vars.AGENT_EVOLUTION_REFLECTION_MODEL }}
          AGENT_EVOLUTION_TASK_MODEL: ${{ vars.AGENT_EVOLUTION_TASK_MODEL }}
          AGENT_HOLDOUT_BUNDLE_BASE64: ${{ secrets.AGENT_HOLDOUT_BUNDLE_BASE64 }}
          AGENT_HOLDOUT_TRUSTED_PUBLIC_KEY: ${{ vars.AGENT_HOLDOUT_TRUSTED_PUBLIC_KEY }}
        run: |
          test "$AGENT_SELF_EVOLUTION_ENABLED" = "true"
          test "$AGENT_SELF_EVOLUTION_GEPA_ENABLED" = "true"
          test "$AGENT_SELF_EVOLUTION_LIVE_ENABLED" = "true"
          test "$AGENT_SELF_EVOLUTION_AUTO_PROMOTION_ENABLED" = "false"
          test -n "$E2B_API_KEY"
          test -n "$NVIDIA_API_KEY"
          test -n "$AGENT_HOLDOUT_BUNDLE_BASE64"
          test -n "$AGENT_HOLDOUT_TRUSTED_PUBLIC_KEY"
      - name: Materialize separately signed holdout bundle
        shell: bash
        env:
          AGENT_HOLDOUT_BUNDLE_BASE64: ${{ secrets.AGENT_HOLDOUT_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          bundle_path="$RUNNER_TEMP/agent-holdout-bundle.json"
          printf '%s' "$AGENT_HOLDOUT_BUNDLE_BASE64" | base64 --decode > "$bundle_path"
          chmod 600 "$bundle_path"
          echo "AGENT_HOLDOUT_BUNDLE_PATH=$bundle_path" >> "$GITHUB_ENV"
      - name: Run bounded GEPA and candidate experiment
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGENT_EVOLUTION_MODEL_API_KEY: ${{ secrets.AGENT_EVOLUTION_MODEL_API_KEY }}
          AGENT_EVOLUTION_REFLECTION_MODEL: ${{ vars.AGENT_EVOLUTION_REFLECTION_MODEL }}
          AGENT_EVOLUTION_TASK_MODEL: ${{ vars.AGENT_EVOLUTION_TASK_MODEL }}
          AGENT_HOLDOUT_TRUSTED_PUBLIC_KEY: ${{ vars.AGENT_HOLDOUT_TRUSTED_PUBLIC_KEY }}
        run: node server/scripts/run_evolution_experiment.js --gepa-provider dspy --sandbox-mode e2b --output-dir evolution-report --require-qualified-live-evidence
      - name: Upload report if generated
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-evolution-report
          path: |
            evolution-report/evolution-report.json
            evolution-report/evolution-report.md
          if-no-files-found: warn
