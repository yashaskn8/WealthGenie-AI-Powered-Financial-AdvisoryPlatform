name: Governed Agent Evolution (Manual)

on:
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: 'Lower-than-hard candidate limit for this experiment'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  live-evolution:
    runs-on: ubuntu-latest
    environment: agent-evolution-lab
    env:
      AGENT_SELF_EVOLUTION_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_GEPA_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_LIVE_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_E2B_ENABLED: 'true'
      AGENT_SELF_EVOLUTION_AUTO_PROMOTION_ENABLED: 'false'
      EVOLUTION_MAX_CANDIDATES: ${{ inputs.candidate_limit }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      AGENT_EVOLUTION_REFLECTION_MODEL: ${{ vars.AGENT_EVOLUTION_REFLECTION_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: python -m pip install --requirement ml-service/requirements.txt
      - name: Run bounded offline/remote evolution experiment
        working-directory: ml-service
        run: python -m agent_evolution.cli --version
      - name: Upload report if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evolution-report
          path: |
            evolution-report.json
            evolution-report.md
          if-no-files-found: ignore
