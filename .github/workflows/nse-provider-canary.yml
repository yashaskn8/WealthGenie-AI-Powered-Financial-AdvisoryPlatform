name: NSE provider qualification canary

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */2 * * 1-5'

permissions:
  contents: read

jobs:
  qualify-nse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Run live NSE qualification
        id: qualify
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          npm run qualify:nse --prefix server 2>&1 | tee artifacts/nse-qualification.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nse-provider-qualification-${{ github.run_id }}
          path: artifacts/nse-qualification.log
          if-no-files-found: error

      - name: Fail the canary when qualification fails
        if: steps.qualify.outcome == 'failure'
        run: exit 1
