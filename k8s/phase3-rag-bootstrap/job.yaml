apiVersion: batch/v1
kind: Job
metadata:
  generateName: wealthgenie-phase3-rag-bootstrap-
  namespace: wealthgenie
  labels:
    app: wealthgenie-phase3-rag-bootstrap
    app.kubernetes.io/name: wealthgenie-phase3-rag-bootstrap
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wealthgenie-phase3-rag-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-bootstrap
          image: wealthgenie-ml-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/bootstrap_rag_corpus.py"]
          envFrom:
            - configMapRef:
                name: wealthgenie-config
          env:
            - name: ENVIRONMENT
              value: production
            - name: ML_STATE_BACKEND
              value: mongodb
            - name: WEALTHGENIE_RAG_BOOTSTRAP
              value: "1"
            - name: RAG_EMBEDDING_PROVIDER
              value: sentence_transformer
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: MONGODB_URI
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
