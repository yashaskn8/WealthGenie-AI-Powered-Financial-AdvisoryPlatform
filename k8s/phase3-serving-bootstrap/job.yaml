apiVersion: batch/v1
kind: Job
metadata:
  generateName: wealthgenie-phase3-serving-bootstrap-
  namespace: wealthgenie
  labels:
    app: wealthgenie-phase3-serving-bootstrap
    app.kubernetes.io/name: wealthgenie-phase3-serving-bootstrap
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wealthgenie-phase3-serving-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: serving-bootstrap
          image: wealthgenie-ml-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/register_trusted_bundles.py"]
          env:
            - name: ENVIRONMENT
              value: production
            - name: ML_STATE_BACKEND
              value: mongodb
            - name: WEALTHGENIE_PHASE3_BOOTSTRAP
              value: "1"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: MONGODB_URI
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
