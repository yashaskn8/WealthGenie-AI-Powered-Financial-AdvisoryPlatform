apiVersion: batch/v1
kind: Job
metadata:
  generateName: wealthgenie-phase4-plan-review-migration-
  namespace: wealthgenie
  labels:
    app: wealthgenie-phase4-plan-review-migration
    app.kubernetes.io/name: wealthgenie-phase4-plan-review-migration
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: wealthgenie-phase4-plan-review-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: phase4-plan-review-migration
          image: wealthgenie-server:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "scripts/migratePlanReviewIndexes.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: MONGODB_MIGRATION_URI
              valueFrom:
                secretKeyRef:
                  name: wealthgenie-secrets
                  key: MONGODB_URI
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
