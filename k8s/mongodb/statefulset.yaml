apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wealthgenie-mongodb
  namespace: wealthgenie
  labels:
    app: wealthgenie-mongodb
spec:
  serviceName: "wealthgenie-mongodb"
  replicas: 1
  selector:
    matchLabels:
      app: wealthgenie-mongodb
  template:
    metadata:
      labels:
        app: wealthgenie-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  mongosh --quiet --eval 'try { quit(rs.status().ok ? 0 : 1) }
                  catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"wealthgenie-mongodb.wealthgenie.svc.cluster.local:27017"}]}); quit(1) }'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongodb-pvc
