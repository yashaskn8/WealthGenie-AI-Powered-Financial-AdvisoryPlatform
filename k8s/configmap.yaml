apiVersion: v1
kind: ConfigMap
metadata:
  name: wealthgenie-config
  namespace: wealthgenie
  labels:
    app.kubernetes.io/name: wealthgenie
data:
  NODE_ENV: "production"
  PORT: "5000"
  ML_PORT: "8000"
  ENVIRONMENT: "production"
  ML_STATE_BACKEND: "mongodb"
  MONGODB_FLAVOR: "mongodb"
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: "strict"
  LLM_DEFAULT_PROVIDER: "mock"
  ML_SERVICE_URL: "http://wealthgenie-ml-service.wealthgenie.svc.cluster.local:8000"
  REDIS_URL: "redis://wealthgenie-redis.wealthgenie.svc.cluster.local:6379"
  # Kind/demo ingress origin. Production overlays must replace this with the
  # real HTTPS frontend origin; validation intentionally rejects HTTP origins.
  CORS_ORIGINS: "https://wealthgenie.local"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
