openapi: 3.1.0
info:
  title: WealthGenie Public API
  version: 2.0.0
  description: Canonical contract for the supported public Express API. Internal metrics and MCP routes are intentionally excluded.
servers:
  - { url: 'http://localhost:5000', description: Local development }
  - { url: '/', description: Same-origin production gateway }

paths:
  /api/auth/register:
    post:
      operationId: registerUser
      tags: [Authentication]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses: { '201': { $ref: '#/components/responses/AuthSession' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/auth/login:
    post:
      operationId: loginUser
      tags: [Authentication]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/logout:
    post:
      operationId: logoutUser
      tags: [Authentication]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/session:
    get:
      operationId: restoreSession
      tags: [Authentication]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/AuthSession' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/profile/build:
    post:
      operationId: buildProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: optional
      requestBody: { $ref: '#/components/requestBodies/ProfileCreate' }
      responses: { '201': { $ref: '#/components/responses/Profile' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/profile/current:
    get:
      operationId: getCurrentProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Profile' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/profile/{profileId}/health-score:
    get:
      operationId: getFinancialHealthScore
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      responses: { '200': { $ref: '#/components/responses/Object' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/profile/{profileId}:
    put:
      operationId: updateProfile
      tags: [Profiles]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/ProfileId' }]
      requestBody: { $ref: '#/components/requestBodies/ProfileUpdate' }
      responses: { '200': { $ref: '#/components/responses/Profile' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/recommend:
    post:
      operationId: createRecommendation
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: required
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/Recommendation' }
      responses: { '200': { $ref: '#/components/responses/Recommendation' }, '201': { $ref: '#/components/responses/Recommendation' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/recommend/audit:
    get:
      operationId: listRecommendationAudits
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters:
        - { name: profileId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses: { '200': { description: Owned audit records, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditMetadata' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/recommend/audit/verify:
    get:
      operationId: verifyRecommendationAuditChain
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { description: Tamper-evident chain status, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/recommend/audit/{id}:
    get:
      operationId: getRecommendationAudit
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Owned audit record, content: { application/json: { schema: { $ref: '#/components/schemas/AuditMetadata' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/recommend/weights:
    post:
      operationId: updateRecommendationWeights
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RecommendationWeights' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/recommend/{recommendationId}/advisory:
    post:
      operationId: generateDeferredAdvisory
      tags: [Advisory]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ name: recommendationId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }]
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/goals/create:
    post:
      operationId: createGoal
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      x-idempotency-key: optional
      requestBody: { $ref: '#/components/requestBodies/GoalCreate' }
      responses: { '201': { $ref: '#/components/responses/Goal' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/goals:
    get:
      operationId: listGoals
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { description: Owned goals, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Goal' } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/goals/{goalId}/refresh-advice:
    patch:
      operationId: refreshGoalAdvice
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      responses: { '200': { $ref: '#/components/responses/Goal' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/goals/{goalId}/simulate:
    post:
      operationId: simulateGoalContribution
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      requestBody: { $ref: '#/components/requestBodies/GoalSimulation' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/goals/{goalId}:
    patch:
      operationId: updateGoal
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      requestBody: { $ref: '#/components/requestBodies/GoalUpdate' }
      responses: { '200': { $ref: '#/components/responses/Goal' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      operationId: deleteGoal
      tags: [Goals]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ $ref: '#/components/parameters/GoalId' }]
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/instruments:
    get:
      operationId: listInstruments
      tags: [Instruments]
      security: []
      responses: { '200': { description: Canonical investment catalog, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Instrument' } } } } } }
  /api/instruments/rank-wti:
    post:
      operationId: rankInstruments
      description: Returns zero to five products from a source-qualified universe after parent-category hard suitability. Phase 2 ranks supported mutual-fund Growth options only when verified AMFI current and approximately one-year historical NAV observations establish an order; otherwise it returns explicitly comparable or unavailable results.
      tags: [Instruments]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RankInstruments' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/projection:
    post:
      operationId: createProjection
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Projection' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/projection/compare:
    post:
      operationId: compareInvestmentProjection
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/ProjectionComparison' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/projection/allocation-split:
    post:
      operationId: calculateAllocationSplit
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/AllocationSplit' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/projection/custom-portfolio:
    post:
      operationId: createCustomPortfolioProjection
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/CustomPortfolioProjection' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/projection/stress-test:
    post:
      operationId: runInstrumentStressTest
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/StressScenario' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/projection/step-up:
    post:
      operationId: calculateStepUpProjection
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/StepUpProjection' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/projection/xirr:
    post:
      operationId: calculateXirr
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Xirr' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/montecarlo/montecarlo:
    post:
      operationId: runMonteCarlo
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/MonteCarlo' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/montecarlo/portfolio:
    post:
      operationId: runPortfolioMonteCarlo
      tags: [Projections]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PortfolioMonteCarlo' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/market/rates:
    get: { operationId: getMarketRates, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/benchmarks:
    get: { operationId: getMarketBenchmarks, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/government-schemes:
    get: { operationId: getGovernmentSchemeFacts, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/fixed-deposits/sbi:
    get: { operationId: getSbiFixedDepositFacts, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/mutual-funds/nav:
    get:
      operationId: getMutualFundNavFacts
      tags: [Market]
      security: []
      parameters:
        - name: schemeCodes
          in: query
          required: true
          schema: { type: string, pattern: '^\d+(,\d+){0,49}$', maxLength: 600 }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/market/params:
    get: { operationId: getMarketParameters, tags: [Market], security: [], responses: { '200': { $ref: '#/components/responses/Object' } } }
  /api/market/refresh:
    post:
      operationId: refreshMarketData
      tags: [Market]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      responses: { '202': { $ref: '#/components/responses/Object' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/tax/compute:
    get:
      operationId: computeTax
      tags: [Tax]
      security: []
      parameters: [{ $ref: '#/components/parameters/Income' }, { $ref: '#/components/parameters/IncomeSource' }, { $ref: '#/components/parameters/FiscalYear' }, { name: regime, in: query, required: true, schema: { type: string, enum: [new, old] } }]
      responses: { '200': { $ref: '#/components/responses/TaxCalculation' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/tax/compare:
    get:
      operationId: compareTaxRegimes
      tags: [Tax]
      security: []
      parameters: [{ $ref: '#/components/parameters/Income' }, { $ref: '#/components/parameters/IncomeSource' }, { $ref: '#/components/parameters/FiscalYear' }]
      responses: { '200': { $ref: '#/components/responses/TaxComparison' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/tax/post-tax-return:
    post:
      operationId: calculatePostTaxReturn
      tags: [Tax]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PostTaxReturn' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' } }
  /api/tax/post-tax-return/batch:
    post:
      operationId: calculatePostTaxReturns
      tags: [Tax]
      security: []
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PostTaxReturnBatch' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' } }

  /api/portfolio/optimise:
    post:
      operationId: optimisePortfolio
      tags: [Portfolio]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/PortfolioOptimise' }
      responses: { '200': { $ref: '#/components/responses/Portfolio' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/portfolio/rebalance:
    post:
      operationId: rebalancePortfolio
      tags: [Portfolio]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Rebalance' }
      responses: { '200': { $ref: '#/components/responses/Portfolio' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/chat/message:
    post:
      operationId: sendChatMessage
      tags: [Chat]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/Chat' }
      responses: { '200': { $ref: '#/components/responses/Chat' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/chat/history:
    get:
      operationId: getChatHistory
      tags: [Chat]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      responses: { '200': { description: Current user's history, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/chat/session/{sessionId}:
    delete:
      operationId: deleteChatSession
      tags: [Chat]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string, maxLength: 100 } }]
      responses: { '200': { $ref: '#/components/responses/Message' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }

  /api/regime/current:
    get: { operationId: getCurrentMarketContext, tags: [Regime], security: [], responses: { '200': { description: Verified market context and additive market snapshot, content: { application/json: { schema: { $ref: '#/components/schemas/MarketContextResponse' } } } } } }
  /api/regime/adjust:
    post:
      operationId: previewProfileSafeMarketContextAdjustment
      tags: [Regime]
      security: [{ CookieAuth: [] }, { BearerAuth: [] }]
      x-csrf-protection: cookie-session
      requestBody: { $ref: '#/components/requestBodies/RegimeAdjust' }
      responses: { '200': { $ref: '#/components/responses/Object' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }

  /health:
    get: { operationId: getHealth, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }
  /health/deep:
    get: { operationId: getDeepHealth, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/ready:
    get: { operationId: getReadiness, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' }, '503': { $ref: '#/components/responses/Unavailable' } } }
  /health/live:
    get: { operationId: getLiveness, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }
  /ready:
    get: { operationId: redirectReadiness, tags: [Health], security: [], responses: { '307': { description: Redirect to /health/ready } } }
  /live:
    get: { operationId: redirectLiveness, tags: [Health], security: [], responses: { '307': { description: Redirect to /health/live } } }
  /healthz:
    get: { operationId: getLegacyLiveness, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }
  /readyz:
    get: { operationId: redirectLegacyReadiness, tags: [Health], security: [], responses: { '307': { description: Redirect to /health/ready } } }
  /api/health:
    get: { operationId: getApiHealth, tags: [Health], security: [], responses: { '200': { $ref: '#/components/responses/Health' } } }

components:
  securitySchemes:
    CookieAuth: { type: apiKey, in: cookie, name: wg_session, description: Secure HttpOnly browser session cookie. }
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Explicitly configured non-browser compatibility authentication. }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    ProfileId: { name: profileId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
    GoalId: { name: goalId, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
    Income: { name: income, in: query, required: true, schema: { type: number, minimum: 0, maximum: 1000000000 } }
    IncomeSource: { name: incomeSource, in: query, required: true, schema: { type: string, enum: [salary, pension, family_pension, business, other] } }
    FiscalYear: { name: fiscalYear, in: query, required: true, schema: { type: string, enum: [FY2025-26, FY2026-27] } }
  requestBodies:
    Register: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }
    Login: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
    ProfileCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialProfileInput' } } } }
    ProfileUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialProfileUpdate' } } } }
    Recommendation: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationRequest' } } } }
    RecommendationWeights: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationWeightsRequest' } } } }
    GoalCreate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoalCreateRequest' } } } }
    GoalUpdate: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoalUpdateRequest' } } } }
    GoalSimulation: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoalSimulationRequest' } } } }
    RankInstruments: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RankInstrumentsRequest' } } } }
    Projection: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectionRequest' } } } }
    ProjectionComparison: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectionComparisonRequest' } } } }
    AllocationSplit: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AllocationSplitRequest' } } } }
    CustomPortfolioProjection: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomPortfolioProjectionRequest' } } } }
    StressScenario: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StressScenarioRequest' } } } }
    StepUpProjection: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StepUpProjectionRequest' } } } }
    Xirr: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/XirrRequest' } } } }
    MonteCarlo: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MonteCarloRequest' } } } }
    PortfolioMonteCarlo: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioMonteCarloRequest' } } } }
    PostTaxReturn: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostTaxReturnRequest' } } } }
    PostTaxReturnBatch: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostTaxReturnBatchRequest' } } } }
    PortfolioOptimise: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioOptimiseRequest' } } } }
    Rebalance: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RebalanceRequest' } } } }
    Chat: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRequest' } } } }
    RegimeAdjust: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegimeAdjustRequest' } } } }
  responses:
    Object: { description: Successful structured response, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    Message: { description: Successful operation, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string } } } } } }
    AuthSession: { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
    Profile: { description: Authoritative financial profile, content: { application/json: { schema: { $ref: '#/components/schemas/FinancialProfile' } } } }
    Recommendation: { description: Recommendation and audit identifiers, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationResponse' } } } }
    Goal: { description: Goal state, content: { application/json: { schema: { $ref: '#/components/schemas/Goal' } } } }
    TaxCalculation: { description: Authoritative tax calculation, content: { application/json: { schema: { $ref: '#/components/schemas/TaxCalculation' } } } }
    TaxComparison: { description: Authoritative regime comparison, content: { application/json: { schema: { $ref: '#/components/schemas/TaxComparison' } } } }
    Portfolio: { description: Server-authoritative portfolio decision, content: { application/json: { schema: { $ref: '#/components/schemas/PortfolioResult' } } } }
    Chat: { description: Assistant response, content: { application/json: { schema: { $ref: '#/components/schemas/ChatResponse' } } } }
    Health: { description: Service health, content: { application/json: { schema: { $ref: '#/components/schemas/HealthStatus' } } } }
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Authentication required or invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Request conflicts with current state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Service or dependency unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error, message, code, request_id]
      properties:
        error: { type: string, description: Backward-compatible summary }
        message: { type: string }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        request_id: { type: [string, 'null'] }
        details: { oneOf: [{ type: array, items: { type: string } }, { type: object, additionalProperties: true }] }
    User:
      type: object
      required: [id, name, email, role]
      properties: { id: { type: string }, name: { type: string }, email: { type: string, format: email }, mobile: { type: [string, 'null'] }, role: { type: string }, createdAt: { type: string, format: date-time } }
    AuthSession:
      type: object
      required: [csrfToken, user]
      properties:
        csrfToken: { type: string, writeOnly: true }
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, writeOnly: true, description: Development-only compatibility field; never emitted in production. }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties: { name: { type: string, minLength: 2, maxLength: 100 }, email: { type: string, format: email }, password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }, mobile: { type: string, minLength: 10, maxLength: 15 } }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, minLength: 8, maxLength: 128, writeOnly: true } }
    FinancialProfileInput:
      type: object
      unevaluatedProperties: false
      required: [monthly_take_home, monthly_savings, age, risk_tolerance, investment_goals, investment_horizon_years]
      properties:
        monthly_take_home: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
        monthly_savings: { type: number, exclusiveMinimum: 0, maximum: 100000000, description: Must be less than monthly_take_home. }
        age: { type: integer, minimum: 18, maximum: 80 }
        risk_tolerance: { type: string, enum: [Conservative, Moderate, Aggressive] }
        sold_property_proceeds: { type: number, nullable: true, minimum: 0, maximum: 10000000000, description: Optional historical context only; never deployable capital. Null means not provided. }
        has_lump_sum: { type: boolean, nullable: true, description: Optional. Null means not provided. }
        lump_sum_amount: { type: number, nullable: true, minimum: 0, maximum: 10000000000, description: Positive when has_lump_sum is true, 0 when false, and null when unknown. }
        liquid_savings: { type: number, nullable: true, minimum: 0, maximum: 1000000000, description: Optional; null means unknown and is never treated as zero. }
        emi_burden_pct: { type: number, nullable: true, minimum: 0, maximum: 100, description: Optional; null means unknown and is never treated as zero. }
        financial_dependents: { type: integer, nullable: true, minimum: 0, maximum: 15, description: Optional; null means not provided. }
        emergency_fund_months: { type: number, nullable: true, minimum: 0, maximum: 120, description: Optional; null means unknown and is never treated as zero. }
        investment_goals: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string, enum: [Retirement, Wealth Growth, Tax Saving, Emergency Fund] } }
        investment_horizon_years: { type: integer, minimum: 1, maximum: 30 }
    FinancialProfileUpdate:
      allOf: [{ $ref: '#/components/schemas/FinancialProfileInput' }, { type: object, required: [version], properties: { version: { type: integer, minimum: 1 } } }]
      unevaluatedProperties: false
    FinancialProfile:
      allOf:
        - { $ref: '#/components/schemas/FinancialProfileInput' }
        - type: object
          required: [profileId, version, monthly_investment_capacity, one_time_investment_capacity, profile_schema_version, risk_capacity_score, risk_capacity_level, final_suitability_level, suitability_reason_codes]
          properties:
            profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }
            version: { type: integer, minimum: 1 }
            monthly_investment_capacity: { type: number, minimum: 0 }
            one_time_investment_capacity: { type: number, minimum: 0 }
            profile_schema_version: { type: string }
            risk_capacity_score: { type: number, minimum: 0, maximum: 100 }
            risk_capacity_level: { type: integer, minimum: 1, maximum: 5 }
            final_suitability_level: { type: integer, minimum: 1, maximum: 5 }
            suitability_reason_codes: { type: array, items: { type: string } }
      unevaluatedProperties: false
    RecommendationRequest: { type: object, additionalProperties: false, required: [profileId], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' } } }
    RecommendationResponse:
      type: object
      required: [recommendationId, audit_id, audit_hash, instruments, model_version, recommendation_policy_version, financial_profile_schema_version, return_basis, final_risk_tier]
      properties: { recommendationId: { type: string }, audit_id: { type: string }, audit_hash: { type: string }, instruments: { type: array, items: { type: object, additionalProperties: true } }, confidence_scores: { type: object, additionalProperties: true }, market_adjustment: { $ref: '#/components/schemas/MarketAdjustmentMetadata' }, current_allocation_source: { type: string, enum: [ORIGINAL_RECOMMENDATION, MARKET_CONTEXT_ADJUSTED, USER_REBALANCED] }, model_version: { type: string }, ml_fallback: { type: boolean }, optional_profile_fields_unknown: { type: array, items: { type: string } }, ml_input_fields_unknown: { type: array, items: { type: string } }, recommendation_policy_version: { type: string }, financial_profile_schema_version: { type: string }, return_basis: { type: string, const: PRE_TAX_NOMINAL }, final_risk_tier: { type: string }, excluded_due_to_eligibility: { type: array, items: { type: object, additionalProperties: true } } }
      additionalProperties: true
    AuditMetadata:
      type: object
      properties: { _id: { type: string }, recommendationId: { type: string }, modelVersion: { type: string }, ruleVersion: { type: string }, citedRagChunkIds: { type: array, items: { type: string } }, previous_hash: { type: [string, 'null'] }, record_hash: { type: string }, hash_algorithm: { type: string }, schema_version: { type: string }, correlationId: { type: string }, createdAt: { type: string, format: date-time } }
      additionalProperties: true
    AuditVerification: { type: object, required: [valid], properties: { valid: { type: boolean }, checked: { type: integer }, reason: { type: string } } }
    RecommendationWeightsRequest: { type: object, additionalProperties: false, required: [profileId, weights], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, weights: { type: object, minProperties: 1, maxProperties: 30, additionalProperties: { type: number, minimum: 0, maximum: 1 }, description: Every recommended instrument must be present and weights must sum to exactly 1. } } }
    GoalCreateRequest:
      type: object
      additionalProperties: false
      required: [goal_name, target_amount, target_date, current_savings, profileId, priority]
      properties: { goal_name: { type: string, minLength: 2, maxLength: 100 }, target_amount: { type: number, minimum: 1000, maximum: 10000000000 }, target_date: { type: string, format: date }, current_savings: { type: number, minimum: 0, maximum: 10000000000 }, profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, priority: { type: string, enum: [Critical, High, Medium, Low] } }
    GoalUpdateRequest: { type: object, additionalProperties: false, minProperties: 1, properties: { target_amount: { type: number, minimum: 1000, maximum: 10000000000 }, current_savings: { type: number, minimum: 0, maximum: 10000000000 }, priority: { type: string, enum: [Critical, High, Medium, Low] } } }
    GoalSimulationRequest: { type: object, additionalProperties: false, required: [monthly_contribution], properties: { monthly_contribution: { type: number, exclusiveMinimum: 0, maximum: 10000000 } } }
    Goal:
      allOf: [{ $ref: '#/components/schemas/GoalCreateRequest' }, { type: object, properties: { _id: { type: string }, monthly_sip_required: { type: number }, probability: { type: number }, status: { type: string } } }]
    Instrument: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, type: { type: string }, expectedReturn: { type: number }, risk: { type: string } }, additionalProperties: true }
    MarketContextResponse:
      type: object
      required: [status, evaluatedAt, marketSnapshot]
      properties:
        status: { type: string, enum: [MARKET_CONTEXT_AVAILABLE, MARKET_CONTEXT_UNAVAILABLE] }
        context: { type: [string, 'null'], enum: [NORMAL, CAUTIOUS, HIGH_VOLATILITY, RISK_OFF, MARKET_CONTEXT_UNAVAILABLE, null] }
        policyVersion: { type: [string, 'null'] }
        evaluatedAt: { type: string, format: date-time }
        marketSnapshot: { $ref: '#/components/schemas/MarketContextSnapshot' }
      additionalProperties: true
    MarketAdjustmentMetadata:
      type: object
      required: [status, applied, actualTotalTiltPct, reasonCodes, suitabilityValidation, concentrationValidation]
      properties:
        status: { type: string, enum: [APPLIED, NOT_APPLIED, UNAVAILABLE] }
        applied: { type: boolean }
        contextStatus: { type: string }
        context: { type: [string, 'null'] }
        policyVersion: { type: [string, 'null'] }
        observedAt: { type: [string, 'null'], format: date-time }
        evaluatedAt: { type: [string, 'null'], format: date-time }
        actualTotalTiltPct: { type: number, minimum: 0 }
        reasonCodes: { type: array, items: { type: string } }
        suitabilityValidation: { type: string }
        concentrationValidation: { type: string }
        currentAllocationSource: { type: string, enum: [ORIGINAL_RECOMMENDATION, MARKET_CONTEXT_ADJUSTED, USER_REBALANCED] }
        supersededByManualRebalanceAt: { type: [string, 'null'], format: date-time }
      additionalProperties: true
    MarketContextSnapshot:
      type: object
      required: [schemaVersion, status, availability, providerStatus, observedFacts, derivedFacts, policyOutput, provenance, marketSession]
      properties:
        schemaVersion: { type: string, const: market-snapshot-1.0.0 }
        status: { type: string, enum: [CURRENT, MARKET_CLOSED, LAST_AVAILABLE, STALE, PARTIAL_DATA, UNAVAILABLE] }
        availability: { type: string, enum: [AVAILABLE, PARTIAL, UNAVAILABLE] }
        providerStatus: { type: object, additionalProperties: true }
        observedFacts: { type: array, items: { $ref: '#/components/schemas/MarketFact' } }
        derivedFacts: { type: array, items: { $ref: '#/components/schemas/MarketFact' } }
        policyOutput: { type: object, required: [semanticClass, dataClass, status, reasonCodes], additionalProperties: true, properties: { semanticClass: { type: string, const: POLICY_OUTPUT }, dataClass: { type: string, const: POLICY_OUTPUT }, status: { type: string }, reasonCodes: { type: array, items: { type: string } } } }
        freshness: { type: [object, 'null'], additionalProperties: true }
        provenance: { type: object, additionalProperties: true }
        observedAt: { type: [string, 'null'], format: date-time }
        evaluatedAt: { type: [string, 'null'], format: date-time }
        marketSession: { type: object, required: [status], additionalProperties: true, properties: { status: { type: string, enum: [MARKET_OPEN, MARKET_CLOSED, MARKET_HOLIDAY, UNKNOWN] } } }
      additionalProperties: true
    MarketFact:
      type: object
      required: [key, value, dataClass, semanticClass, availabilityStatus]
      properties:
        key: { type: string }
        value: { type: [number, 'null'] }
        unit: { type: [string, 'null'] }
        dataClass: { type: [string, 'null'], description: Provider fact class such as LIVE or DAILY; null for derived features. }
        semanticClass: { type: string, enum: [OBSERVED, DERIVED] }
        availabilityStatus: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
      additionalProperties: true
    RankInstrumentsRequest: { type: object, additionalProperties: false, required: [profileId, parentInstrumentId], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, parentInstrumentId: { type: string, maxLength: 50 } } }
    ProjectionRequest: { type: object, additionalProperties: false, required: [profileId, instruments, monthly_investment, years], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, instruments: { type: array, minItems: 1, maxItems: 10, items: { type: string, maxLength: 50 } }, monthly_investment: { type: number, exclusiveMinimum: 0, maximum: 10000000 }, years: { type: array, minItems: 1, maxItems: 10, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 30 } } } }
    ProjectionComparisonRequest: { type: object, additionalProperties: false, required: [monthlyInvestment, annualReturnRate, benchmarkRate, inflationRate, years], properties: { monthlyInvestment: { type: number, exclusiveMinimum: 0, maximum: 10000000 }, annualReturnRate: { type: number, exclusiveMinimum: -1, maximum: 1 }, benchmarkRate: { type: number, exclusiveMinimum: -1, maximum: 1 }, inflationRate: { type: number, minimum: 0, maximum: 1 }, years: { type: integer, minimum: 1, maximum: 50 } } }
    AllocationSplitRequest: { type: object, additionalProperties: false, required: [monthlyInvestment, equityPct], properties: { monthlyInvestment: { type: number, exclusiveMinimum: 0, maximum: 10000000 }, equityPct: { type: number, minimum: 0, maximum: 100 } } }
    PortfolioWeights: { type: object, minProperties: 1, maxProperties: 30, additionalProperties: { type: number, minimum: 0, maximum: 1 }, description: Weights must sum to exactly 1. }
    CustomPortfolioProjectionRequest: { type: object, additionalProperties: false, required: [profileId, allocations, years], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, allocations: { $ref: '#/components/schemas/PortfolioWeights' }, years: { type: integer, minimum: 1, maximum: 30 } } }
    StressScenarioRequest: { type: object, additionalProperties: false, required: [profileId, instrumentId, principal], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, instrumentId: { type: string, minLength: 1, maxLength: 50 }, principal: { type: number, minimum: 1000, maximum: 10000000 } } }
    StepUpProjectionRequest: { type: object, additionalProperties: false, required: [monthlyInvestment, annualReturnRate, years, annualStepUpRate], properties: { monthlyInvestment: { type: number, exclusiveMinimum: 0, maximum: 10000000 }, annualReturnRate: { type: number, exclusiveMinimum: -1, maximum: 1 }, years: { type: integer, minimum: 1, maximum: 50 }, annualStepUpRate: { type: number, minimum: 0, maximum: 1 } } }
    XirrRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [cashflows]
          properties:
            cashflows:
              type: array
              minItems: 2
              maxItems: 1000
              items:
                type: object
                additionalProperties: false
                required: [amount, date]
                properties:
                  amount: { type: number }
                  date: { type: string, format: date }
            guess: { type: number, exclusiveMinimum: -1, maximum: 10 }
        - type: object
          additionalProperties: false
          required: [monthlySIP, months, currentValue]
          properties:
            monthlySIP: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
            months: { type: integer, minimum: 1, maximum: 1200 }
            currentValue: { type: number, exclusiveMinimum: 0, maximum: 10000000000 }
    MonteCarloRequest: { type: object, additionalProperties: false, required: [profileId, instrument, monthly_investment, years], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, instrument: { type: string, maxLength: 50 }, monthly_investment: { type: number, exclusiveMinimum: 0, maximum: 10000000 }, years: { type: integer, minimum: 1, maximum: 30 }, target_amount: { type: number, minimum: 1000, maximum: 10000000000 } } }
    PortfolioMonteCarloRequest: { type: object, additionalProperties: false, required: [profileId, allocations, years], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, allocations: { $ref: '#/components/schemas/PortfolioWeights' }, years: { type: integer, minimum: 1, maximum: 30 }, target_amount: { type: number, minimum: 1000, maximum: 10000000000 } } }
    TaxCalculation: { type: object, properties: { regime: { type: string }, tax: { type: number }, effectiveRate: { type: number } }, additionalProperties: true }
    TaxComparison: { type: object, properties: { old: { $ref: '#/components/schemas/TaxCalculation' }, new: { $ref: '#/components/schemas/TaxCalculation' }, recommendedRegime: { type: string, enum: [old, new] } }, additionalProperties: true }
    PostTaxInstrument: { type: object, additionalProperties: false, required: [instrumentType, nominalRate, holdingYears, monthlySIP], properties: { instrumentType: { type: string, maxLength: 50 }, nominalRate: { type: number, minimum: 0, maximum: 1 }, holdingYears: { type: number, minimum: 0.01, maximum: 100 }, monthlySIP: { type: number, minimum: 0, maximum: 100000000 } } }
    PostTaxReturnRequest: { allOf: [{ $ref: '#/components/schemas/PostTaxInstrument' }, { type: object, required: [annualIncome, regime, userAge, incomeSource, fiscalYear], properties: { annualIncome: { type: number, minimum: 0, maximum: 1000000000 }, regime: { type: string, enum: [new, old] }, userAge: { type: integer, minimum: 0, maximum: 120 }, incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }, fiscalYear: { type: string, enum: [FY2025-26, FY2026-27] } } }], unevaluatedProperties: false }
    PostTaxReturnBatchRequest: { type: object, additionalProperties: false, required: [instruments, annualIncome, regime, userAge, incomeSource, inflationRate, fiscalYear], properties: { instruments: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/PostTaxInstrument' } }, annualIncome: { type: number, minimum: 0, maximum: 1000000000 }, regime: { type: string, enum: [new, old] }, userAge: { type: integer, minimum: 0, maximum: 120 }, incomeSource: { type: string, enum: [salary, pension, family_pension, business, other] }, inflationRate: { type: number, minimum: 0, maximum: 1 }, fiscalYear: { type: string, enum: [FY2025-26, FY2026-27] } } }
    PortfolioOptimiseRequest: { type: object, additionalProperties: false, required: [profileId, assets, strategy], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, assets: { type: array, minItems: 2, maxItems: 20, uniqueItems: true, items: { type: string, maxLength: 50 } }, strategy: { type: string, enum: [min_variance, max_sharpe, risk_parity, max_return] } } }
    RebalanceRequest: { type: object, additionalProperties: false, required: [profileId, current_allocation, target_allocation, threshold, partial_ratio, holding_months], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' }, current_allocation: { type: object, minProperties: 1, maxProperties: 30, additionalProperties: { type: number, minimum: 0, maximum: 1000000000 } }, target_allocation: { type: object, minProperties: 1, maxProperties: 30, additionalProperties: { type: number, minimum: 0, maximum: 100 }, description: Weights must sum to exactly 100. }, threshold: { type: number, minimum: 0, maximum: 50 }, partial_ratio: { type: number, minimum: 0.1, maximum: 1 }, holding_months: { type: number, minimum: 0, maximum: 600 } } }
    PortfolioResult: { type: object, properties: { weights: { type: object, additionalProperties: { type: number } }, trades: { type: array, items: { type: object, additionalProperties: true } } }, additionalProperties: true }
    ChatRequest: { type: object, additionalProperties: false, required: [message], properties: { message: { type: string, minLength: 1, maxLength: 1000 }, session_id: { type: string, maxLength: 100 } } }
    ChatResponse: { type: object, properties: { response: { type: string }, session_id: { type: string }, citations: { type: array, items: { type: string } } }, additionalProperties: true }
    RegimeAdjustRequest: { type: object, additionalProperties: false, required: [profileId], properties: { profileId: { type: string, pattern: '^[0-9a-fA-F]{24}$' } } }
    HealthStatus: { type: object, required: [status], properties: { status: { type: string }, timestamp: { type: string, format: date-time }, service: { type: string } }, additionalProperties: true }
