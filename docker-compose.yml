version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: wealthgenie-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: wealthgenie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wealthgenie-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TRACE_LOG_PATH=/app/traces.jsonl
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://localhost}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          # Match the Kubernetes Service name used by the shared nginx image.
          - wealthgenie-server

  reactapp:
    build:
      context: ./reactapp
      dockerfile: Dockerfile
    container_name: wealthgenie-reactapp
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: wealthgenie-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TRACE_LOG_PATH=/app/traces.jsonl
      - ENVIRONMENT=production
      - ML_STATE_BACKEND=mongodb
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - ML_OPERATOR_KEY=${ML_OPERATOR_KEY:-}
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
