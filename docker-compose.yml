version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: wealthgenie-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}) }'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: wealthgenie-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wealthgenie-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TRACE_LOG_PATH=/app/traces.jsonl
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      # Docker Compose is the local HTTP integration stack. Production must
      # terminate HTTPS and provide independently managed secrets.
      - NODE_ENV=development
      - AGENT_WORKER_MODE=external
      - AGENT_WORKER_ENABLED=false
      - JWT_SECRET=${JWT_SECRET:-local-compose-jwt-secret-at-least-32-characters}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-strict}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      - MONGODB_FLAVOR=${MONGODB_FLAVOR:-mongodb}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
        aliases:
          # Match the Kubernetes Service name used by the shared nginx image.
          - wealthgenie-server

  agent-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wealthgenie-agent-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    expose:
      - "5050"
    environment:
      - TRACE_LOG_PATH=/app/traces-worker.jsonl
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - AGENT_WORKER_MODE=external
      - AGENT_WORKER_ENABLED=true
      - AGENT_WORKER_HEALTH_PORT=5050
      - JWT_SECRET=${JWT_SECRET:-local-compose-jwt-secret-at-least-32-characters}
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - REQUIRE_REDIS=${REQUIRE_REDIS:-false}
      - MONGODB_FLAVOR=${MONGODB_FLAVOR:-mongodb}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5050/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
    networks:
      default:
        aliases:
          - wealthgenie-agent-worker

  reactapp:
    build:
      context: ./reactapp
      dockerfile: Dockerfile
    container_name: wealthgenie-reactapp
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: wealthgenie-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TRACE_LOG_PATH=/app/traces.jsonl
      - ENVIRONMENT=production
      - ML_STATE_BACKEND=mongodb
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - ML_OPERATOR_KEY=${ML_OPERATOR_KEY:-}
      - MONGODB_URI=mongodb://mongodb:27017/wealthgenie?replicaSet=rs0
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
